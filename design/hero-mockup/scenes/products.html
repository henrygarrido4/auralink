<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample shop: product photo</title>
    <!--
      The hero image of the sample ceramics shop shown on the mockup's screens: three stoneware
      pieces on a plinth. Rendered by ../render.mjs into reports/hero-mockup/products.png.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import {
        contactShadow,
        createRenderer,
        publish,
        publishError,
        readSize,
        roomEnvironment,
      } from './kit.js';

      try {
        const { width, height } = readSize(1200, 1240);
        const renderer = createRenderer({ width, height });
        renderer.toneMappingExposure = 1.05;
        const scene = new THREE.Scene();
        scene.environment = roomEnvironment(renderer);
        scene.environmentIntensity = 0.55;

        const stone = '#dedcd9';
        scene.background = new THREE.Color(stone);

        // Seamless paper sweep: a floor that curves up into the back wall.
        const sweepProfile = [
          [80, 0],
          [-12, 0],
        ];
        for (let i = 1; i <= 32; i += 1) {
          const a = (i / 32) * (Math.PI / 2);
          sweepProfile.push([-12 - Math.sin(a) * 30, 30 - Math.cos(a) * 30]);
        }
        sweepProfile.push([-42, 160]);
        const sweepPositions = [];
        const sweepIndex = [];
        sweepProfile.forEach(([z, y], i) => {
          sweepPositions.push(-150, y, z, 150, y, z);
          if (i < sweepProfile.length - 1) {
            const a = i * 2;
            sweepIndex.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
        });
        const sweepGeometry = new THREE.BufferGeometry();
        sweepGeometry.setAttribute('position', new THREE.Float32BufferAttribute(sweepPositions, 3));
        sweepGeometry.setIndex(sweepIndex);
        sweepGeometry.computeVertexNormals();
        const sweep = new THREE.Mesh(
          sweepGeometry,
          new THREE.MeshStandardMaterial({ color: stone, roughness: 1 }),
        );
        sweep.receiveShadow = true;
        scene.add(sweep);

        // Plinth.
        const plinthHeight = 4.2;
        const plinth = new THREE.Mesh(
          new THREE.CylinderGeometry(7.6, 7.6, plinthHeight, 128),
          new THREE.MeshStandardMaterial({ color: '#efedea', roughness: 0.82 }),
        );
        plinth.position.set(-1.5, plinthHeight / 2, 0);
        plinth.castShadow = true;
        plinth.receiveShadow = true;
        scene.add(plinth);

        /** Turns a smooth profile (radius, height) into a lathe; split at `footHeight` for raw clay. */
        const vessel = ({ points, glaze, footHeight, clay = '#d8cab5' }) => {
          const curve = new THREE.SplineCurve(points.map(([r, y]) => new THREE.Vector2(r, y)));
          const profile = curve.getSpacedPoints(160);
          const group = new THREE.Group();
          const foot = profile.filter((p) => p.y <= footHeight + 0.05);
          // The glaze stands slightly proud of the clay, which also hides the seam.
          const body = profile
            .filter((p) => p.y >= footHeight - 0.05)
            .map((p) => new THREE.Vector2(p.x + 0.03, p.y));
          const footMesh = new THREE.Mesh(
            new THREE.LatheGeometry([new THREE.Vector2(0, 0), ...foot], 160),
            new THREE.MeshStandardMaterial({ color: clay, roughness: 0.9 }),
          );
          const bodyMesh = new THREE.Mesh(new THREE.LatheGeometry(body, 160), glaze);
          for (const mesh of [footMesh, bodyMesh]) {
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
          }
          return group;
        };

        // Tall vase in the brand yellow, glossy glaze over a raw foot.
        const yellowVase = vessel({
          footHeight: 0.9,
          glaze: new THREE.MeshPhysicalMaterial({
            color: '#f7db15',
            roughness: 0.3,
            clearcoat: 0.7,
            clearcoatRoughness: 0.15,
          }),
          points: [
            [2.6, 0],
            [3.0, 0.5],
            [3.9, 2.8],
            [4.35, 5.6],
            [4.1, 8.4],
            [3.2, 10.9],
            [2.05, 13],
            [1.7, 14.6],
            [1.85, 15.7],
            [1.95, 16.1],
            [1.6, 16.1],
            [1.45, 15.2],
          ],
        });
        yellowVase.position.set(-3.6, plinthHeight, -1.4);
        scene.add(yellowVase);

        // Speckled white bud vase.
        const speckle = document.createElement('canvas');
        speckle.width = 1024;
        speckle.height = 512;
        const sctx = speckle.getContext('2d');
        sctx.fillStyle = '#f0ebe4';
        sctx.fillRect(0, 0, speckle.width, speckle.height);
        let seed = 7;
        const random = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
        for (let i = 0; i < 2600; i += 1) {
          sctx.fillStyle = `rgba(74, 66, 58, ${0.35 + random() * 0.5})`;
          sctx.beginPath();
          sctx.arc(random() * 1024, random() * 512, 0.6 + random() * 1.6, 0, Math.PI * 2);
          sctx.fill();
        }
        const speckleTexture = new THREE.CanvasTexture(speckle);
        speckleTexture.colorSpace = THREE.SRGBColorSpace;
        speckleTexture.anisotropy = 8;
        const budVase = vessel({
          footHeight: 0.5,
          glaze: new THREE.MeshPhysicalMaterial({
            map: speckleTexture,
            roughness: 0.55,
            clearcoat: 0.25,
            clearcoatRoughness: 0.4,
          }),
          points: [
            [1.5, 0],
            [2.3, 0.9],
            [2.95, 2.6],
            [2.85, 4.4],
            [2.0, 5.9],
            [1.05, 6.9],
            [0.85, 7.6],
            [0.95, 8.1],
            [0.7, 8.1],
            [0.6, 7.5],
          ],
        });
        budVase.position.set(2.1, plinthHeight, 2.4);
        scene.add(budVase);

        // Charcoal mug on the floor, with a handle.
        const charcoal = new THREE.MeshStandardMaterial({ color: '#2c2b29', roughness: 0.62 });
        const mug = vessel({
          footHeight: 0.6,
          glaze: charcoal,
          points: [
            [3.5, 0],
            [3.9, 0.5],
            [4.0, 1.4],
            [4.05, 5],
            [4.1, 8.6],
            [4.0, 9.1],
            [3.75, 9.15],
            [3.7, 8.6],
            [3.6, 1.6],
            [0.01, 1.3],
          ],
        });
        const handle = new THREE.Mesh(
          new THREE.TorusGeometry(2.3, 0.5, 24, 64, Math.PI * 1.15),
          charcoal,
        );
        handle.rotation.z = -Math.PI / 2 - 0.08;
        handle.position.set(3.95, 4.9, 0);
        handle.castShadow = true;
        mug.add(handle);
        mug.position.set(10.4, 0, 5.2);
        mug.rotation.y = 0.75;
        scene.add(mug);

        // Soft key light from the left, as from a window.
        const key = new THREE.DirectionalLight('#fffaf3', 2.6);
        key.position.set(-34, 42, 26);
        key.target.position.set(0, 4, 0);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.radius = 14;
        key.shadow.blurSamples = 24;
        key.shadow.bias = -0.0004;
        Object.assign(key.shadow.camera, {
          left: -30,
          right: 30,
          top: 30,
          bottom: -30,
          near: 1,
          far: 140,
        });
        scene.add(key, key.target);
        scene.add(new THREE.HemisphereLight('#ffffff', '#d6d4d0', 0.45));

        const floorContact = contactShadow(renderer, scene, {
          size: 60,
          height: 4.4,
          darkness: 1.4,
          blur: 2.6,
        });
        floorContact.group.children[0].material.opacity = 0.55;
        const plinthContact = contactShadow(renderer, scene, {
          size: 16,
          resolution: 512,
          height: 3,
          darkness: 1.6,
          blur: 2.2,
        });
        plinthContact.group.position.set(-1.5, plinthHeight + 0.002, 0);
        plinthContact.group.children[0].material.opacity = 0.6;

        const camera = new THREE.PerspectiveCamera(30, width / height, 20, 400);
        camera.position.set(-2, 21, 64);
        camera.lookAt(3, 8.4, 0);

        floorContact.update([sweep]);
        plinthContact.update([sweep, plinth]);
        renderer.render(scene, camera);
        publish(renderer);
      } catch (error) {
        publishError(error);
      }
    </script>
  </body>
</html>
