<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marl ceramics (sample website, mobile)</title>
    <!-- Phone screen of the hero mockup: screenshotted at 390x844, 3x, by ../render.mjs. -->
    <link rel="stylesheet" href="sample-site.css" />
    <style>
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 6px 30px 0 34px;
        font-size: 16px;
        font-weight: 600;
      }
      .status svg {
        height: 12px;
        fill: currentColor;
      }
      .announce {
        height: 34px;
        font-size: 12px;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: 60px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        font-size: 22px;
      }
      header .wordmark {
        font-size: 27px;
      }
      header .bag {
        justify-self: end;
      }
      .hero {
        padding: 30px 22px 0;
      }
      .eyebrow {
        font-size: 11px;
      }
      h1 {
        margin-top: 16px;
        font-size: 47px;
        line-height: 1;
      }
      .lede {
        margin-top: 16px;
        font-size: 16px;
        line-height: 1.5;
      }
      .button {
        width: 100%;
        height: 52px;
        margin-top: 24px;
        font-size: 16px;
      }
      .media {
        height: 380px;
        margin-top: 26px;
        border-radius: 22px;
      }
      .media img {
        object-position: 40% 55%;
      }
      .chip {
        left: 14px;
        bottom: 14px;
        padding: 8px 10px 8px 16px;
        font-size: 13px;
      }
      .chip b {
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <span>9:41</span>
      <svg viewBox="0 0 64 12" aria-hidden="true">
        <rect x="0" y="7" width="3" height="5" rx="1" />
        <rect x="5" y="5" width="3" height="7" rx="1" />
        <rect x="10" y="3" width="3" height="9" rx="1" />
        <rect x="15" y="0" width="3" height="12" rx="1" />
        <path
          d="M30 3.5a10 10 0 0 1 13 0l-1.4 1.5a8 8 0 0 0-10.2 0zM32.6 6.4a6 6 0 0 1 7.8 0L39 7.9a4 4 0 0 0-5 0zM36.5 11l-2-2a2.8 2.8 0 0 1 4 0z"
        />
        <rect x="47" y="1" width="15" height="10" rx="3" fill="none" stroke="currentColor" />
        <rect x="49" y="3" width="10" height="6" rx="1.5" />
        <rect x="62.6" y="4.2" width="1.4" height="3.6" rx="0.7" />
      </svg>
    </div>
    <div class="announce">
      Join the list for first access
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </div>
    <header>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h10" />
      </svg>
      <a class="wordmark" href="#">marl</a>
      <span class="bag">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 8h14l-1 13H6L5 8Z" />
          <path d="M9 8a3 3 0 0 1 6 0" />
        </svg>
        <span>2</span>
      </span>
    </header>
    <main class="hero">
      <p class="eyebrow">New spring glazes</p>
      <h1>Made by hand for slow mornings.</h1>
      <p class="lede">Stoneware mugs, bowls and vases, thrown and glazed in small batches.</p>
      <a class="button" href="#">Shop the collection</a>
      <figure class="media">
        <img src="/out/products.png" alt="" />
        <figcaption class="chip">The Sunlit vase <b>New</b></figcaption>
      </figure>
    </main>
  </body>
</html>
