<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marl ceramics (sample website, desktop)</title>
    <!-- Laptop screen of the hero mockup: screenshotted at 1440x900, 2x, by ../render.mjs. -->
    <link rel="stylesheet" href="sample-site.css" />
    <style>
      .announce {
        height: 40px;
        font-size: 13px;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: 84px;
        padding: 0 64px;
        border-bottom: 1px solid var(--line);
      }
      header .wordmark {
        font-size: 31px;
      }
      header nav {
        display: flex;
        gap: 40px;
        font-size: 15px;
        font-weight: 500;
      }
      .tools {
        display: flex;
        justify-content: flex-end;
        gap: 26px;
        font-size: 21px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr 1.08fr;
        gap: 72px;
        align-items: center;
        padding: 44px 64px 0;
      }
      .eyebrow {
        font-size: 13px;
      }
      h1 {
        margin-top: 26px;
        font-size: 86px;
        line-height: 0.98;
      }
      .lede {
        margin-top: 28px;
        max-width: 25em;
        font-size: 19px;
        line-height: 1.55;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-top: 40px;
        font-size: 16px;
      }
      .button {
        height: 56px;
        padding: 0 32px;
      }
      .media {
        height: 600px;
        border-radius: 28px;
      }
      .chip {
        left: 24px;
        bottom: 24px;
        padding: 10px 12px 10px 20px;
        font-size: 15px;
      }
      .chip b {
        padding: 5px 10px;
      }
      .next {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 44px 64px 0;
      }
      .next h2 {
        margin: 0;
        font-family: var(--display);
        font-weight: 500;
        font-size: 34px;
        letter-spacing: -0.02em;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        padding: 22px 64px 0;
      }
      .tile {
        height: 120px;
      }
    </style>
  </head>
  <body>
    <div class="announce">
      Join the studio list for first access to new glazes
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </div>
    <header>
      <a class="wordmark" href="#">marl<small>Ceramics</small></a>
      <nav>
        <a href="#">Shop</a>
        <a href="#">Collections</a>
        <a href="#">Studio</a>
        <a href="#">Journal</a>
      </nav>
      <div class="tools">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" />
        </svg>
        <span class="bag">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 8h14l-1 13H6L5 8Z" />
            <path d="M9 8a3 3 0 0 1 6 0" />
          </svg>
          <span>2</span>
        </span>
      </div>
    </header>
    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">New spring glazes</p>
          <h1>Made by hand for slow mornings.</h1>
          <p class="lede">
            Stoneware mugs, bowls and vases, thrown and glazed in small batches in our studio.
          </p>
          <div class="actions">
            <a class="button" href="#">Shop the collection</a>
            <a class="text-link" href="#">
              Our process
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </a>
          </div>
        </div>
        <figure class="media">
          <img src="/out/products.png" alt="" />
          <figcaption class="chip">The Sunlit vase <b>New</b></figcaption>
        </figure>
      </section>
      <div class="next">
        <h2>Shop by piece</h2>
        <a class="text-link" href="#">View all</a>
      </div>
      <div class="tiles">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>
    </main>
  </body>
</html>
